server:
  port: 8084

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5436/notificationdb
    username: notification_user
    password: notification_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.banktransfer.notification_service.event"
        spring.json.type.mapping: accountCreated:com.banktransfer.notification_service.event.AccountCreatedEvent,complaintCreated:com.banktransfer.notification_service.event.ComplaintCreatedEvent,complaintResolved:com.banktransfer.notification_service.event.ComplaintResolvedEvent,passwordResetRequested:com.banktransfer.notification_service.event.PasswordResetRequestedEvent
  mail:
    host: smtp.gmail.com
    port: 587
    username: WeBank2710@gmail.com
    password: ${GMAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

services:
  gateway-url: http://localhost:8080
  notification-technical-user:
    email: notification-service@banktransfer.internal
    password: ${NOTIFICATION_SERVICE_PASSWORD}