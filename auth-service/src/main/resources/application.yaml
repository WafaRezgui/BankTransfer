server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5433/authdb
    username: auth_user
    password: auth_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
jwt:
  secret: ${JWT_SECRET:5b7dbae714333303cd4543f5c41049358b3d985ed68feb58a414ce2b68d0a018}
  expiration: ${JWT_EXPIRATION:86400000}