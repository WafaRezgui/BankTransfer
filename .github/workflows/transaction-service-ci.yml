name: CI - transaction-service

on:
  push:
    branches: [main]
    paths:
      - 'transaction-service/**'
  pull_request:
    branches: [main]
    paths:
      - 'transaction-service/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupère le code
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build avec Maven
        working-directory: ./transaction-service
        run: mvn clean compile