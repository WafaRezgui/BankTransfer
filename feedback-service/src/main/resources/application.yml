server:
  port: 8086

spring:
  application:
    name: feedback-service

  datasource:
    url: jdbc:postgresql://localhost:5437/feedbackdb
    username: feedback_user
    password: feedback_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: complaintCreated:com.banktransfer.feedback_service.event.ComplaintCreatedEvent,complaintResolved:com.banktransfer.feedback_service.event.ComplaintResolvedEvent
    consumer:
      group-id: feedback-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.banktransfer.feedback_service.event"