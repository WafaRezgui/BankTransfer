server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/auth/**

        - id: account-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/accounts/**

        - id: transaction-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/transactions/**

        - id: feedback-service-route
          uri: http://localhost:8086
          predicates:
            - Path=/complaints/**,/feedbacks/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
              - "http://localhost:8090"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
jwt:
  secret: ${JWT_SECRET:5b7dbae714333303cd4543f5c41049358b3d985ed68feb58a414ce2b68d0a018}